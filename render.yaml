# Render.com deployment blueprint for LuckyBlox.
#
# Deploy with: Render dashboard -> New -> Blueprint -> select this repo.
# The service is a Docker web service; Render injects PORT automatically and we
# bind 0.0.0.0 inside the container so it is reachable from the internet.
services:
  - type: web
    name: luckyblox-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: LUCKYBLOX_BRIDGE_HOST
        value: 127.0.0.1
      - key: LUCKYBLOX_BRIDGE_PORT
        value: "3001"
      - key: LUCKYBLOX_GAME_HOST
        value: 0.0.0.0
      # Serve the real site ("off"). Set to "on" only to show the placeholder
      # preview page while the build is unfinished.
      - key: LUCKYBLOX_PREVIEW_MODE
        value: "off"
      - key: LUCKYBLOX_PREVIEW_STAGE
        value: In development
      # PORT is provided by Render; do not hardcode it here.
      - key: LUCKBLOX_SECRET
        generateValue: true
      # Owner account (id 1). The password is hashed and applied to the owner at
      # boot, so it survives redeploys and never lives in the repo. Set the real
      # value in the Render dashboard (Environment -> Add Environment Variable)
      # or with `sync: false`; leave the placeholder to be prompted on first sync.
      - key: LUCKYBLOX_OWNER_ID
        value: "1"
      - key: LUCKYBLOX_OWNER_USERNAME
        value: tailsthehero10
      - key: LUCKYBLOX_OWNER_PASSWORD
        sync: false
      # Accounts, sessions and currency live in a data dir. On the free plan the
      # container filesystem is wiped on every deploy, so without a disk the owner
      # password (and every account) resets. Either attach a Render Disk and set
      # LUCKYBLOX_DATA_DIR to its mount path, or keep the owner password in the
      # env var above so it is re-applied on each boot.
      # - key: LUCKYBLOX_DATA_DIR
      #   value: /var/data
