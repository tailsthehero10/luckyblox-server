<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{font-family:system-ui;margin:0;padding:16px;background:#fff}
.row{display:flex;gap:20px;align-items:center;margin:14px 0}
.light{background:#dee1e3;padding:12px;border-radius:6px;color:#393b3d;display:flex;align-items:center;gap:10px}
.dark{background:#191b1d;padding:12px;border-radius:6px;color:#fff;display:flex;align-items:center;gap:10px}
.g{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.g::before{content:"";width:18px;height:18px;background-color:currentColor;
 -webkit-mask:url("/icons/robux.svg") center/contain no-repeat;mask:url("/icons/robux.svg") center/contain no-repeat}
.big::before{width:110px;height:110px}
.lbl{font-size:12px;color:#666;margin:0 0 2px}
</style></head><body>
<p class="lbl">1 = the real Roblox texture shipped in Clients/2020M</p>
<div class="row">
  <img src="/img/real-robux.png" width="110" height="110" alt="real">
  <img src="/img/real-robux-mono.png" width="110" height="110" alt="real mono">
</div>
<p class="lbl">2 = our themed SVG mask, light and dark</p>
<div class="row">
  <div class="light"><span class="g">0</span><span class="g big"></span></div>
  <div class="dark"><span class="g">0</span><span class="g big"></span></div>
</div>
<p class="lbl">3 = our SVG as img, and the real texture as img</p>
<div class="row">
  <img src="/icons/robux.svg" width="110" height="110">
  <img src="/img/real-robux.png" width="110" height="110">
</div>
</body></html>
