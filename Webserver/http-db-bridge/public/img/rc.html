<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{font-family:system-ui;margin:0;padding:18px;background:#fff}
.light{background:#dee1e3;padding:12px;border-radius:6px;color:#393b3d;display:flex;align-items:center;gap:10px}
.dark{background:#191b1d;padding:12px;border-radius:6px;color:#fff;display:flex;align-items:center;gap:10px}
.g{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.g::before{content:"";width:18px;height:18px;background-color:currentColor;
 -webkit-mask:url("/icons/robux.svg") center/contain no-repeat;mask:url("/icons/robux.svg") center/contain no-repeat}
.big::before{width:120px;height:120px}
</style></head><body>
<h3>light</h3><div class="light"><span class="g">0</span><span class="g big"></span></div>
<h3>dark</h3><div class="dark"><span class="g">0</span><span class="g big"></span></div>
<h3>as img</h3><div style="display:flex;gap:16px;align-items:center;margin-top:8px">
<img src="/icons/robux.svg" width="120" height="120"><img src="/icons/robux.svg" width="32" height="32"><img src="/icons/robux.svg" width="16" height="16"></div>
</body></html>
